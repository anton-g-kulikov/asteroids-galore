<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Asteroids Galore</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05060d;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; margin: 0 auto; height: 100%; }
</style>
</head>
<body>
<canvas id="game" aria-label="Asteroids Galore: hold the left or right side of the screen to steer"></canvas>
<script>
(() => {
  'use strict';

  // ---------- Tuning ----------
  const MAX_FIELD_WIDTH = 560;   // px; wider screens get a centred play field
  const SPEED_RAMP = 0.03;       // speed multiplier gained per second
  const MAX_SPEED = 4.5;
  const BEST_KEY = 'asteroids-galore-best';
  const POINTS_PER_PERSON = 25;
  const LEVEL_MIN_TIME = 20;     // seconds of dodging before a level can end
  const levelTarget = l => 350 + 150 * (l - 1);          // points to earn within the level
  const levelCapacity = l => 6 + 2 * (l - 1);            // seats for rescued crew
  const levelHandling = l => Math.max(0.5, 0.92 ** (l - 1));   // bigger ship steers slower
  const DILEMMA_EVERY = 3;       // every Nth rescue is a "save these or those" choice

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  let W = 0, H = 0, U = 1;       // field size in CSS px; U = base unit (scales sprites)
  let state = 'menu';            // 'menu' | 'play' | 'over'
  let stateTime = 0;             // seconds since the state began
  let time = 0, speed = 1, score = 0, spawnTimer = 0, shake = 0;
  let level = 1, levelTime = 0, levelScore = 0, onboard = 0, levelBanner = 0;
  let rescued = 0, rescueTimer = 0, rescueCount = 0, banner = 0, clock = 0;
  let best = 0, newBest = false;
  try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}

  const ship = { x: 0, y: 0, vx: 0, r: 0 };
  let asteroids = [], particles = [], floaters = [], stars = [];

  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- Layout ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const oldW = W || 1;
    W = Math.min(window.innerWidth, MAX_FIELD_WIDTH);
    H = window.innerHeight;
    U = Math.min(W, H * 0.7) / 400;
    canvas.style.width = W + 'px';
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ship.r = 13 * U;
    ship.x = state === 'play' ? ship.x * W / oldW : W / 2;
    ship.y = H - Math.max(110 * U, H * 0.16);
    if (!stars.length) {
      for (let i = 0; i < 90; i++) stars.push({ x: Math.random(), y: Math.random(), z: rand(0.2, 1) });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Input ----------
  const pointers = new Map();    // pointerId -> -1 (left side) | 1 (right side)
  const keys = { left: false, right: false };

  function steer() {
    let l = keys.left, r = keys.right;
    for (const side of pointers.values()) { if (side < 0) l = true; else r = true; }
    return (r ? 1 : 0) - (l ? 1 : 0);   // both thumbs down = hold course
  }

  function tryStart() {
    if (state === 'menu' || (state === 'over' && stateTime > 0.7)) startGame();
  }

  window.addEventListener('pointerdown', e => {
    e.preventDefault();
    pointers.set(e.pointerId, e.clientX < window.innerWidth / 2 ? -1 : 1);
    tryStart();
  }, { passive: false });
  // Sliding a thumb across the middle switches direction without lifting.
  window.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e.clientX < window.innerWidth / 2 ? -1 : 1);
  });
  const release = e => pointers.delete(e.pointerId);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', () => { pointers.clear(); keys.left = keys.right = false; });
  window.addEventListener('contextmenu', e => e.preventDefault());
  // iOS Safari ignores touch-action for some gestures; block them explicitly.
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    else if (e.key === ' ' || e.key === 'Enter') { if (!e.repeat) tryStart(); }
    else return;
    e.preventDefault();
    if (!e.repeat && state === 'menu') tryStart();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  // ---------- Game ----------
  function setState(s) { state = s; stateTime = 0; }

  function startGame() {
    asteroids = []; particles = []; floaters = [];
    time = 0; speed = 1; score = 0; spawnTimer = 0.6; shake = 0; newBest = false;
    level = 1; levelTime = 0; levelScore = 0; onboard = 0; levelBanner = 2.5;
    rescued = 0; rescueTimer = 4; rescueCount = 0; banner = 0;
    ship.x = W / 2; ship.vx = 0;
    setState('play');
  }

  function makeAsteroid(x, r, o) {
    const n = Math.floor(rand(8, 13));
    const shape = [];
    for (let i = 0; i < n; i++) shape.push(rand(0.72, 1.08));
    const craters = [];
    for (let i = 0, c = r > 32 * U ? 3 : Math.floor(rand(1, 3)); i < c; i++) {
      craters.push({ a: rand(0, 6.283), d: rand(0.15, 0.55), r: rand(0.12, 0.24) });
    }
    return Object.assign({
      x, y: -r - 4, r, shape, craters,
      vx: rand(-26, 26) * U,
      vy: rand(0.8, 1.3),                      // multiplied by the scroll speed
      rot: rand(0, 6.283), spin: rand(-1.4, 1.4),
      shade: Math.floor(rand(0, 3)),
      people: 0,      // stranded crew waiting for pickup
      link: null,     // the other asteroid of a "choose one" pair
      lost: false,    // crew can no longer be reached (the other option was taken)
    }, o);
  }

  function spawnAsteroid() {
    const big = Math.random() < 0.18;
    const r = (big ? rand(34, 50) : rand(14, 30)) * U;
    asteroids.push(makeAsteroid(rand(r * 0.4, W - r * 0.4), r, big ? { vy: rand(0.7, 1.1) } : null));
  }

  // Rescue asteroids fall straight and steady so the approach is readable.
  const RESCUE = () => ({ vx: 0, vy: 0.9, spin: rand(-0.5, 0.5) });

  function spawnRescue() {
    const r = rand(22, 28) * U;
    asteroids.push(makeAsteroid(rand(W * 0.15, W * 0.85), r,
      Object.assign(RESCUE(), { people: 1 + Math.floor(rand(0, 3)) })));
  }

  // Two crews at once, on opposite sides: 2 people in the open, or 4 wedged
  // between escort rocks. Picking up one side loses the other.
  function spawnDilemma() {
    const side = Math.random() < 0.5 ? -1 : 1;
    const y = -70 * U;
    const easy = makeAsteroid(W / 2 - side * W * 0.28, 24 * U, Object.assign(RESCUE(), { people: 2, y }));
    const hard = makeAsteroid(W / 2 + side * W * 0.28, 26 * U, Object.assign(RESCUE(), { people: 4, y }));
    easy.link = hard; hard.link = easy;
    asteroids.push(easy, hard);
    for (const d of [-1, 1]) {
      asteroids.push(makeAsteroid(hard.x + d * (hard.r + 52 * U), 14 * U, Object.assign(RESCUE(), { y })));
    }
    banner = 2.5;
    spawnTimer = Math.max(spawnTimer, 0.9);   // brief lull so the choice is readable
  }

  // Pickup range: a ring around the rock that widens a little as things speed up.
  const ringRadius = a => a.r + (30 + 8 * speed) * U;

  // Each level restarts the asteroid speed ramp, but the ship carries more and steers slower.
  function nextLevel() {
    level++;
    levelTime = 0; levelScore = 0;
    onboard = 0;                              // crew delivered
    levelBanner = 3;
    spawnTimer = Math.max(spawnTimer, 1.2);   // short breather
    rescueTimer = 4;
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
  }

  // Takes as many people as there are free seats; the rest stay behind.
  function rescue(a) {
    const n = Math.min(a.people, levelCapacity(level) - onboard);
    const pts = n * POINTS_PER_PERSON;
    score += pts; levelScore += pts;
    rescued += n; onboard += n;
    floaters.push({ x: a.x, y: a.y - a.r, str: `+${pts}`, life: 1.2 });
    for (let i = 0; i < 14; i++) {
      const t = rand(0.2, 0.45);   // crew "beam" towards the ship
      particles.push({
        x: a.x + rand(-1, 1) * a.r, y: a.y + rand(-1, 1) * a.r,
        vx: (ship.x - a.x) / t, vy: (ship.y - a.y) / t,
        life: t, max: t, size: rand(1.5, 3) * U, color: '#5dffa0',
      });
    }
    a.people -= n;
    if (a.link) { a.link.lost = true; a.link.link = null; a.link = null; }
    if (navigator.vibrate) navigator.vibrate(30);
  }

  function explode(x, y) {
    for (let i = 0; i < 46; i++) {
      const a = rand(0, 6.283), v = rand(40, 420) * U;
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: rand(0.4, 1.1), max: 1.1, size: rand(1.5, 4.5) * U,
        color: ['#ffd166', '#ff7b54', '#ffffff', '#7fdcff'][i % 4],
      });
    }
  }

  function gameOver() {
    explode(ship.x, ship.y);
    shake = 0.5;
    const final = Math.floor(score);
    if (final > best) {
      best = final; newBest = true;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    if (navigator.vibrate) navigator.vibrate([60, 40, 140]);
    setState('over');
  }

  function update(dt) {
    stateTime += dt;
    clock += dt;
    banner = Math.max(0, banner - dt);
    levelBanner = Math.max(0, levelBanner - dt);
    const scroll = H * 0.34 * (state === 'play' ? speed : state === 'over' ? 0.25 : 0.6);

    for (const s of stars) {
      s.y += (scroll * 0.35 * s.z * dt) / H;
      if (s.y > 1) { s.y -= 1; s.x = Math.random(); }
    }

    if (state === 'play') {
      time += dt;
      levelTime += dt;
      speed = Math.min(MAX_SPEED, 1 + levelTime * SPEED_RAMP);
      score += dt * speed * 10;
      levelScore += dt * speed * 10;
      if (levelScore >= levelTarget(level) && levelTime >= LEVEL_MIN_TIME) nextLevel();

      // Ship: quick, slightly weighty lateral movement.
      const maxV = W * (1.25 + speed * 0.18) * levelHandling(level);
      const target = steer() * maxV;
      ship.vx += (target - ship.vx) * Math.min(1, dt * (target ? 9 : 7));
      ship.x += ship.vx * dt;
      const margin = ship.r * 1.3;
      if (ship.x < margin) { ship.x = margin; ship.vx = 0; }
      if (ship.x > W - margin) { ship.x = W - margin; ship.vx = 0; }

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnAsteroid();
        // Slightly denser over time, and scaled so wide fields aren't sparse.
        spawnTimer = rand(0.4, 0.8) * (400 * U / W) / (0.75 + speed * 0.25);
      }

      rescueTimer -= dt;
      if (rescueTimer <= 0) {
        rescueCount++;
        if (rescueCount % DILEMMA_EVERY === 0) spawnDilemma(); else spawnRescue();
        rescueTimer = rand(5, 8);
      }
    }

    for (const a of asteroids) {
      a.y += a.vy * scroll * dt;
      a.x += a.vx * dt;
      a.rot += a.spin * dt;
      if (state === 'play') {
        const dx = a.x - ship.x, dy = a.y - ship.y;
        if (a.people && !a.lost && onboard < levelCapacity(level)) {
          const reach = ringRadius(a) + ship.r * 0.5;
          if (dx * dx + dy * dy < reach * reach) rescue(a);
        }
        const hit = a.r * 0.86 + ship.r * 0.7;   // forgiving hitbox
        if (dx * dx + dy * dy < hit * hit) { gameOver(); }
      }
    }
    asteroids = asteroids.filter(a => a.y - a.r < H + 10);

    if (state === 'play' && Math.random() < dt * 60) {
      particles.push({
        x: ship.x + rand(-3, 3) * U, y: ship.y + ship.r * 1.1,
        vx: rand(-14, 14) * U - ship.vx * 0.15, vy: rand(120, 220) * U,
        life: rand(0.15, 0.35), max: 0.35, size: rand(1.5, 3.2) * U,
        color: Math.random() < 0.5 ? '#7fdcff' : '#ffd166',
      });
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const f of floaters) { f.y -= 45 * U * dt; f.life -= dt; }
    floaters = floaters.filter(f => f.life > 0);
    shake = Math.max(0, shake - dt);
  }

  // ---------- Rendering ----------
  const ROCK = [['#8b8f9c', '#5b5f6b'], ['#9a8a7b', '#62564b'], ['#7d8794', '#4c545f']];

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    const n = a.shape.length;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2, rr = a.r * a.shape[i];
      const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
    const [light, dark] = ROCK[a.shade];
    ctx.fillStyle = light;
    ctx.fill();
    ctx.lineWidth = Math.max(1.5, 2 * U);
    ctx.strokeStyle = dark;
    ctx.stroke();
    ctx.fillStyle = dark;
    for (const c of a.craters) {
      ctx.beginPath();
      ctx.arc(Math.cos(c.a) * c.d * a.r, Math.sin(c.a) * c.d * a.r, c.r * a.r, 0, Math.PI * 2);
      ctx.fill();
    }
    // stranded crew, standing around the rim and waving
    for (let i = 0; i < a.people; i++) {
      const s = 4.6 * U;
      ctx.save();
      ctx.rotate((i / a.people) * Math.PI * 2 + 0.4);
      ctx.translate(0, -a.r * 0.92);
      ctx.strokeStyle = ctx.fillStyle = a.lost ? '#6b6f7a' : '#ffb347';
      ctx.lineWidth = 1.6 * U;
      ctx.lineCap = 'round';
      const wave = a.lost ? 0.3 : Math.sin(clock * 9 + i * 2) * 0.5;
      for (const d of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(d * s * 0.5, -s * 0.9);
        ctx.lineTo(d * s * (1.3 + wave * d * 0.5), -s * (1.9 + wave * d));
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.roundRect(-s * 0.6, -s * 1.5, s * 1.2, s * 1.7, s * 0.4);
      ctx.fill();
      ctx.fillStyle = a.lost ? '#9a9da6' : '#ffffff';
      ctx.beginPath(); ctx.arc(0, -s * 2.1, s * 0.75, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    if (a.people && !a.lost) {
      const R = ringRadius(a);
      ctx.save();
      const full = onboard >= levelCapacity(level);
      const col = full ? '#8a8f9c' : '#5dffa0';
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.55 + 0.3 * Math.sin(clock * 6);
      ctx.lineWidth = 2 * U;
      ctx.setLineDash([8 * U, 7 * U]);
      ctx.lineDashOffset = -clock * 30 * U;
      ctx.beginPath(); ctx.arc(a.x, a.y, R, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      text(full ? 'SHIP FULL' : `SOS ×${a.people}`, a.x, a.y - R - 8 * U, 14 * U, col);
    }
  }

  function drawShip() {
    const r = ship.r;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(Math.max(-0.45, Math.min(0.45, ship.vx / (W * 1.4) * 0.45)));
    // engine flame
    const f = r * (1.0 + Math.random() * 0.5);
    ctx.fillStyle = '#ffb347';
    ctx.beginPath();
    ctx.moveTo(-r * 0.32, r * 0.75); ctx.lineTo(0, r * 0.75 + f); ctx.lineTo(r * 0.32, r * 0.75);
    ctx.fill();
    // wings
    ctx.fillStyle = '#3d7dd8';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.2); ctx.lineTo(r * 1.15, r * 0.95); ctx.lineTo(r * 0.3, r * 0.7);
    ctx.lineTo(-r * 0.3, r * 0.7); ctx.lineTo(-r * 1.15, r * 0.95);
    ctx.closePath(); ctx.fill();
    // hull
    ctx.fillStyle = '#e8eefc';
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.35);
    ctx.quadraticCurveTo(r * 0.55, -r * 0.2, r * 0.42, r * 0.85);
    ctx.lineTo(-r * 0.42, r * 0.85);
    ctx.quadraticCurveTo(-r * 0.55, -r * 0.2, 0, -r * 1.35);
    ctx.fill();
    // cockpit
    ctx.fillStyle = '#39c6ff';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.35, r * 0.2, r * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function text(str, x, y, size, color, align = 'center', weight = 700) {
    ctx.font = `${weight} ${Math.round(size)}px ${FONT}`;
    ctx.textAlign = align;
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawTouchHints(alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const y = H * 0.8, s = 18 * U;
    for (const dir of [-1, 1]) {
      const x = W / 2 + dir * W * 0.3;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2 * U;
      ctx.beginPath(); ctx.arc(x, y, 34 * U, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(x + dir * s, y); ctx.lineTo(x - dir * s * 0.6, y - s); ctx.lineTo(x - dir * s * 0.6, y + s);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function render() {
    ctx.save();
    ctx.fillStyle = '#05060d';
    ctx.fillRect(0, 0, W, H);
    if (shake > 0) ctx.translate(rand(-1, 1) * shake * 16 * U, rand(-1, 1) * shake * 16 * U);

    for (const s of stars) {
      ctx.globalAlpha = 0.25 + s.z * 0.6;
      ctx.fillStyle = '#cfe0ff';
      const sz = (0.6 + s.z * 1.4) * U;
      ctx.fillRect(s.x * W, s.y * H, sz, sz * (1 + (state === 'play' ? speed - 1 : 0) * s.z * 1.5));
    }
    ctx.globalAlpha = 1;

    for (const a of asteroids) drawAsteroid(a);
    for (const a of asteroids) {
      if (a.link && a.x < a.link.x) text('OR', (a.x + a.link.x) / 2, a.y + 6 * U, 18 * U, '#ffd166', 'center', 800);
    }
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    for (const f of floaters) {
      ctx.globalAlpha = Math.min(1, f.life * 2);
      text(f.str, f.x, f.y, 20 * U, '#5dffa0', 'center', 800);
    }
    ctx.globalAlpha = 1;
    if (state !== 'over') drawShip();
    ctx.restore();

    const top = 44 * U + 8;
    if (state === 'play') {
      text(String(Math.floor(score)), W / 2, top, 34 * U, '#ffffff');
      text(`BEST ${best}`, W - 14, top - 8 * U, 13 * U, 'rgba(255,255,255,.55)', 'right', 600);
      text(`LEVEL ${level}`, 14, top - 8 * U, 13 * U, 'rgba(127,220,255,.9)', 'left', 700);

      // level progress: points bar, then "hold on" if the minimum time isn't up yet
      const target = levelTarget(level), bw = 150 * U, bh = 5 * U, bx = W / 2 - bw / 2, by = top + 10 * U;
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
      ctx.fillStyle = '#7fdcff';
      ctx.beginPath(); ctx.roundRect(bx, by, bw * Math.min(1, levelScore / target), bh, bh / 2); ctx.fill();
      text(`${Math.min(target, Math.floor(levelScore))} / ${target}`, bx + bw + 8 * U, by + bh + 1 * U, 11 * U, 'rgba(255,255,255,.6)', 'left', 600);

      // ship capacity: one seat per pip, filled as crew come aboard
      const cap = levelCapacity(level);
      const step = Math.min(14 * U, (W - 40) / cap), pw = step * 0.68, ph = 9 * U;
      const px = W / 2 - (cap * step - (step - pw)) / 2, py = by + bh + 9 * U;
      for (let i = 0; i < cap; i++) {
        ctx.beginPath(); ctx.roundRect(px + i * step, py, pw, ph, pw * 0.3);
        if (i < onboard) { ctx.fillStyle = '#5dffa0'; ctx.fill(); }
        else { ctx.strokeStyle = 'rgba(93,255,160,.55)'; ctx.lineWidth = 1.2 * U; ctx.stroke(); }
      }
      text(`CREW ${onboard}/${cap}`, W / 2, py + ph + 14 * U, 11 * U, onboard >= cap ? '#ffd166' : 'rgba(93,255,160,.85)', 'center', 700);

      if (levelScore >= target && levelTime < LEVEL_MIN_TIME) {
        text(`HOLD ON ${Math.ceil(LEVEL_MIN_TIME - levelTime)}s`, W / 2, py + ph + 34 * U, 13 * U, '#7fdcff');
      }
      if (banner > 0) {
        ctx.globalAlpha = Math.min(1, banner * 2);
        text('TWO CREWS — YOU CAN ONLY SAVE ONE', W / 2, py + ph + 54 * U, 13 * U, '#ffd166');
        ctx.globalAlpha = 1;
      }
      if (levelBanner > 0) {
        ctx.globalAlpha = Math.min(1, levelBanner * 2);
        text(`LEVEL ${level}`, W / 2, H * 0.4, 44 * U, '#ffffff', 'center', 800);
        text(level === 1 ? `Room for ${cap} crew` : `Crew delivered · room for ${cap} · heavier ship`,
          W / 2, H * 0.4 + 28 * U, 15 * U, '#7fdcff', 'center', 600);
        ctx.globalAlpha = 1;
      }
      if (time < 3.5) drawTouchHints(0.35 * Math.min(1, 3.5 - time));
    } else if (state === 'menu') {
      text('ASTEROIDS', W / 2, H * 0.3, 46 * U, '#ffffff', 'center', 800);
      text('GALORE', W / 2, H * 0.3 + 44 * U, 46 * U, '#7fdcff', 'center', 800);
      text('Dodge the rocks. No guns, just flying.', W / 2, H * 0.3 + 84 * U, 15 * U, 'rgba(255,255,255,.7)', 'center', 500);
      text('Fly close to stranded crews to rescue them.', W / 2, H * 0.3 + 106 * U, 15 * U, '#5dffa0', 'center', 500);
      if (best) text(`BEST ${best}`, W / 2, H * 0.3 + 138 * U, 15 * U, '#ffd166', 'center', 700);
      drawTouchHints(0.55);
      text('hold left', W / 2 - W * 0.3, H * 0.8 + 62 * U, 13 * U, 'rgba(255,255,255,.7)', 'center', 600);
      text('hold right', W / 2 + W * 0.3, H * 0.8 + 62 * U, 13 * U, 'rgba(255,255,255,.7)', 'center', 600);
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateTime * 4);
      text('TAP TO START', W / 2, H * 0.58, 20 * U, '#ffffff');
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = `rgba(5,6,13,${Math.min(0.55, stateTime * 1.2)})`;
      ctx.fillRect(0, 0, W, H);
      text('GAME OVER', W / 2, H * 0.32, 38 * U, '#ff7b54', 'center', 800);
      text(String(Math.floor(score)), W / 2, H * 0.32 + 70 * U, 62 * U, '#ffffff', 'center', 800);
      text(newBest ? 'NEW BEST!' : `BEST ${best}`, W / 2, H * 0.32 + 102 * U, 16 * U, '#ffd166');
      text(`Level ${level} · ${rescued} rescued`, W / 2, H * 0.32 + 130 * U, 16 * U, '#5dffa0');
      if (stateTime > 0.7) {
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateTime * 4);
        text('TAP TO RETRY', W / 2, H * 0.62, 20 * U, '#ffffff');
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);   // clamp: no jumps after tab switch
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Test/debug hook.
  window.__game = { get state() { return state; }, get score() { return score; }, get speed() { return speed; },
    get asteroids() { return asteroids; }, get rescued() { return rescued; }, get level() { return level; }, get onboard() { return onboard; }, ship, spawnRescue, spawnDilemma };
})();
</script>
</body>
</html>
